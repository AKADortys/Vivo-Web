<div class="card shadow-sm">
  <!-- En-tête du panneau collapsible -->
  <div
    class="card-header d-flex justify-content-between align-items-center"
    style="cursor: pointer"
    data-bs-toggle="collapse"
    data-bs-target="#filtersCollapsePanel"
  >
    <h5 class="mb-0 fw-bold"><i class="bi bi-funnel"></i> Filtres</h5>
    <i class="bi bi-chevron-down"></i>
  </div>

  <!-- Contenu du panneau collapsible -->
  <div id="filtersCollapsePanel" class="collapse">
    <div class="card-body">
      <!-- Recherche -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-search"></i> Recherche (nom/email)
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Entrez un nom ou un email"
          [(ngModel)]="filters.search"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Statut -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-person-check"></i> Statut
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.isActive"
          (ngModelChange)="emitFilter()"
        >
          <option [ngValue]="null">Tous</option>
          <option [ngValue]="true">Actif</option>
          <option [ngValue]="false">Inactif</option>
        </select>
      </div>

      <!-- Nombre d’utilisateurs -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-list-nested"></i> Utilisateurs par page
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.pageSize"
          (ngModelChange)="emitFilter()"
        >
          @for(size of pageSizeOptions; track size){
          <option [ngValue]="size">{{ size }}</option>
          }
        </select>
      </div>

      <!-- Dates -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-event"></i> Date de début
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.startDate"
            (ngModelChange)="emitFilter()"
          />
        </div>

        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-check"></i> Date de fin
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.endDate"
            (ngModelChange)="emitFilter()"
          />
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-between mt-4">
        <button
          class="btn btn-outline-secondary d-flex align-items-center gap-2"
          (click)="resetFilter()"
        >
          <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>
