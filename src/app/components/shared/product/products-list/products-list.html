<h3 class="display-5">Listes des produits</h3>
<div class="mb-2 row justify-content-around align-items-start">
  <!-- Composant de gestion des requêtes (recherche) -->
  <app-query-handler-bar
    [searchQuery]="searchQuery()"
    (searchChange)="onSearchChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    [PageSize]="itemsPerPage()"
    class="col-12 col-md-8"
  />
  <button
    class="col-12 col-md-4 col-xl-3 col-xxl-2 btn btn-outline-primary btn-lg"
    (click)="onAddProduct()"
  >
    <i class="bi bi-plus-circle-fill"></i> Ajouter
  </button>
</div>
<!-- Composant de pagination -->
<app-pagination
  [totalItems]="totalItems()"
  [itemsPerPage]="itemsPerPage()"
  [currentPage]="currentPage()"
  (pageChange)="onPageChange($event)"
  class="col-12"
/>
<div class="container-fluid rounded p-4 border shadow-sm">
  <!-- Affichage des utilisateurs -->
  <div class="row justify-content-around">
    @for (product of products(); track product._id) {
    <div class="col-12 col-md-10 col-xl-6 mb-2" [class.loading]="isLoading()">
      <app-product-card
        [product]="product"
        (editProduct)="onEditProduct($event)"
        (removeProduct)="onRemoveProduct()"
      />
    </div>
    }
  </div>
</div>
<!-- Composant de pagination -->
<app-pagination
  [totalItems]="totalItems()"
  [itemsPerPage]="itemsPerPage()"
  [currentPage]="currentPage()"
  (pageChange)="onPageChange($event)"
  class="col-12"
/>

<app-modal #addModal title="Ajouter un produit">
  <app-add-product (submited)="onAddedProduct()" />
</app-modal>

<!-- Modal Edit -->
<app-modal #editModal title="Eddition produit">
  <app-product-edit [product]="selectedProduct()" (save)="onEditedProduct()" />
</app-modal>
