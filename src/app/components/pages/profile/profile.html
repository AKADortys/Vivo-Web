<div class="container container-full-height fade-in">
  @if (user$ | async; as user) {
  <div class="row info">
    <div class="col-md-4">
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex flex-column align-items-center text-center">
            <div class="mt-3">
              <h4>{{ user.name }} {{ user.lastName }}</h4>
              <p class="text-secondary mb-1">{{ user.role }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card mb-3">
        <div class="card-body">
          <div class="row">
            <div class="col-sm-3">
              <h6 class="mb-0">Full Name</h6>
            </div>
            <div class="col-sm-9 text-secondary">
              {{ user.name }} {{ user.lastName }}
            </div>
          </div>
          <hr />
          <div class="row">
            <div class="col-sm-3">
              <h6 class="mb-0">Email</h6>
            </div>
            <div class="col-sm-9 text-secondary">
              {{ user.mail }}
            </div>
          </div>
          <hr />
          <div class="row">
            <div class="col-sm-3">
              <h6 class="mb-0">Phone</h6>
            </div>
            <div class="col-sm-9 text-secondary">
              {{ user.phone }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  }

  <div class="row mt-4">
    <div class="col-12">
      <app-order-history />
    </div>
  </div>
</div>
