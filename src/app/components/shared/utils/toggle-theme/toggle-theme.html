<div class="input-group align-items-center" style="max-width: 260px">
  <label class="input-group-text" for="themeToggle">
    Thème {{ isDark() ? "Sombre" : "Clair" }}
  </label>

  <div class="input-group-text bg-transparent border-0">
    <div class="form-check form-switch m-0">
      <input
        class="form-check-input"
        type="checkbox"
        id="themeToggle"
        [ngModel]="isDark()"
        (ngModelChange)="toggle()"
      />
    </div>
  </div>
</div>
