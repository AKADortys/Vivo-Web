<div class="accordion mb-3 shadow-sm" id="searchAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingOptions">
      <button
        class="accordion-button collapsed"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseOptions"
        aria-expanded="false"
        aria-controls="collapseOptions"
      >
        Options de recherche
      </button>
    </h2>

    <div
      id="collapseOptions"
      class="accordion-collapse collapse"
      aria-labelledby="headingOptions"
      data-bs-parent="#searchAccordion"
    >
      <div class="accordion-body">
        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Rechercher..."
            [ngModel]="searchQuery()"
            (ngModelChange)="onSearchChange($event)"
            aria-label="Rechercher"
          />
          <span class="input-group-text">
            <i class="bi bi-search"></i>
          </span>
        </div>

        <div class="input-group">
          <label class="input-group-text" for="pageSizeSelect">éléments</label>
          <select
            class="form-select"
            id="pageSizeSelect"
            [ngModel]="PageSize()"
            (ngModelChange)="onPageSizeChange($event)"
          >
            @for(size of PageSizeOptions; track size) {
            <option [value]="size">
              {{ size }}
            </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
