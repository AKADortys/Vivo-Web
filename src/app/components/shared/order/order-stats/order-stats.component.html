<div class="container mt-4">
  <div class="row mb-4 align-items-end">
    <div class="col-md-3">
      <label for="startDate" class="form-label">Date de début</label>
      <input type="date" id="startDate" class="form-control" [ngModel]="startDate()"
        (ngModelChange)="startDate.set($event)">
    </div>
    <div class="col-md-3">
      <label for="endDate" class="form-label">Date de fin</label>
      <input type="date" id="endDate" class="form-control" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)">
    </div>
    <div class="col-md-4 d-flex gap-2">
      <button class="btn btn-primary" (click)="filterByDate()" [disabled]="!startDate() || !endDate()">
        Filtrer
      </button>
      <button class="btn btn-secondary" (click)="resetFilter()" [disabled]="!startDate() && !endDate()">
        Réinitialiser
      </button>
    </div>
  </div>
</div>

<div class="container" *ngIf="stats() as data">
  <div class="row">
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-primary h-100">
        <div class="card-header">Total des Commandes</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ data.totalOrders }}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-success h-100">
        <div class="card-header">Revenu Total</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ data.totalRevenue | currency:'EUR' }}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-info h-100">
        <div class="card-header">Panier Moyen</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ data.averageBasket | currency:'EUR' }}</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          Commandes par Statut
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center"
            *ngFor="let status of data.ordersByStatus">
            {{ status._id }}
            <span class="badge bg-secondary rounded-pill">{{ status.count }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div *ngIf="errorMessage()" class="alert alert-danger mt-3">
  {{ errorMessage() }}
</div>
