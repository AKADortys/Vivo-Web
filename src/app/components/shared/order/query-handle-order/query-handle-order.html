<div class="card shadow-sm">
  <!-- En-tête collapsible -->
  <div
    class="card-header d-flex justify-content-between align-items-center"
    style="cursor: pointer"
    data-bs-toggle="collapse"
    data-bs-target="#orderFilterCollapse"
  >
    <h5 class="mb-0 fw-bold"><i class="bi bi-funnel"></i> Filtres commandes</h5>
    <i class="bi bi-chevron-down"></i>
  </div>

  <div id="orderFilterCollapse" class="collapse">
    <div class="card-body">
      <!-- Statut -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-flag"></i> Statut
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.status"
          (ngModelChange)="emitFilter()"
        >
          <option [ngValue]="undefined">Tous</option>
          <option value="En attente">En attente</option>
          <option value="Annulée">Annulée</option>
          <option value="En préparation">En préparation</option>
          <option value="Refusée">Refusée</option>
          <option value="Payée">Payée</option>
          <option value="Terminée">Terminée</option>
        </select>
      </div>

      <!-- ID Produit -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-box-seam"></i> ID Produit
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="ID produit"
          [(ngModel)]="filters.productId"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Quantité minimale -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-stack"></i> Quantité min
        </label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="filters.minQty"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Fourchette de prix -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-cash-coin"></i> Prix min
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="filters.minPrice"
            (ngModelChange)="emitFilter()"
          />
        </div>

        <div class="col-6">
          <label class="form-label fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-cash-stack"></i> Prix max
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="filters.maxPrice"
            (ngModelChange)="emitFilter()"
          />
        </div>
      </div>

      <!-- Adresse -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-geo-alt"></i> Adresse
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Adresse"
          [(ngModel)]="filters.address"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Dates -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-event"></i> Date début
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.startDate"
            (ngModelChange)="emitFilter()"
          />
        </div>

        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-check"></i> Date fin
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.endDate"
            (ngModelChange)="emitFilter()"
          />
        </div>
      </div>

      <!-- Pagination -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-list-nested"></i> Nombre d'éléments
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.pageSize"
          (ngModelChange)="emitFilter()"
        >
          @for (opt of pageSizeOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
          }
        </select>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-between mt-4">
        <button
          class="btn btn-outline-secondary d-flex align-items-center gap-2"
          (click)="resetFilter()"
        >
          <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>
