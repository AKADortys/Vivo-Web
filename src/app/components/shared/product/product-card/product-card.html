@if (product()) {
<div class="card border-0 shadow-lg rounded-4 overflow-hidden">
  <div
    class="card-header bg-light d-flex justify-content-between align-items-center py-3 px-4"
  >
    <h5 class="mb-0 fw-semibold text-dark">
      <i class="bi bi-box-seam me-2 text-primary"></i>{{ product().label }}
    </h5>
    <span
      class="badge px-3 py-2 rounded-pill {{
        product().available
          ? 'bg-success-subtle text-success'
          : 'bg-danger-subtle text-danger'
      }}"
    >
      {{ product().available ? "Disponible" : "Indisponible" }}
    </span>
  </div>

  <div class="card-body px-4 pb-4 pt-3">
    <div class="mb-3">
      <small class="text-muted d-block mb-1">
        <i class="bi bi-tag me-1"></i>Catégorie
      </small>
      <span class="fw-medium">{{ product().category }}</span>
    </div>

    <p class="text-secondary mb-4">
      {{ product().description }}
    </p>

    <div class="d-flex align-items-center justify-content-between mb-4">
      <h5 class="text-primary mb-0 fw-bold">
        <i class="bi bi-currency-euro me-1"></i>{{ product().price }}
      </h5>
      <div>
        <button class="btn btn-sm btn-outline-primary me-2" (click)="onEdit()">
          <i class="bi bi-pencil-square me-1"></i>Modifier
        </button>
        <app-remove-product
          (onRemoved)="onRemove()"
          [productId]="product()._id"
        />
      </div>
    </div>

    <div
      class="border-top pt-3 d-flex justify-content-between small text-muted"
    >
      <span>
        <i class="bi bi-calendar-plus me-1"></i>Créé le
        {{ product().createdAt | formatDate }}
      </span>
      <span>
        <i class="bi bi-calendar-check me-1"></i>Mis à jour le
        {{ product().updatedAt | formatDate }}
      </span>
    </div>
  </div>
</div>
}
