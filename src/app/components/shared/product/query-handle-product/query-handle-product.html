<div class="card shadow-sm">
  <!-- En-tête du panneau collapsible -->
  <div
    class="card-header d-flex justify-content-between align-items-center"
    style="cursor: pointer"
    data-bs-toggle="collapse"
    data-bs-target="#filterCollapse"
  >
    <h5 class="mb-0 fw-bold"><i class="bi bi-funnel"></i> Filtres</h5>
    <i class="bi bi-chevron-down"></i>
  </div>

  <!-- Contenu du panneau collapsible -->
  <div id="filterCollapse" class="collapse">
    <div class="card-body">
      <!-- Recherche textuelle -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-search"></i> Recherche
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Rechercher..."
          [(ngModel)]="filters.search"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Catégorie -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-tags"></i> Catégorie
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Catégorie"
          [(ngModel)]="filters.category"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Disponibilité -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-check-circle"></i> Disponible
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.available"
          (ngModelChange)="emitFilter()"
        >
          <option [ngValue]="undefined">Toutes</option>
          <option [ngValue]="true">Disponible</option>
          <option [ngValue]="false">Indisponible</option>
        </select>
      </div>

      <!-- Fourchette de prix -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-cash-coin"></i> Prix min
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="filters.minPrice"
            (ngModelChange)="emitFilter()"
          />
        </div>
        <div class="col-6">
          <label class="form-label fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-cash-stack"></i> Prix max
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="filters.maxPrice"
            (ngModelChange)="emitFilter()"
          />
        </div>
      </div>

      <!-- Label exact -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-tag"></i> Label exact
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Label exact"
          [(ngModel)]="filters.label"
          (ngModelChange)="emitFilter()"
        />
      </div>

      <!-- Dates -->
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-event"></i> Date début
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.startDate"
            (ngModelChange)="emitFilter()"
          />
        </div>
        <div class="col-6">
          <label class="form-label fw-bold">
            <i class="bi bi-calendar-check"></i> Date fin
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filters.endDate"
            (ngModelChange)="emitFilter()"
          />
        </div>
      </div>

      <!-- Nombre d’éléments -->
      <div class="mb-3">
        <label class="form-label fw-bold">
          <i class="bi bi-list-nested"></i> Nombre d’éléments
        </label>
        <select
          class="form-select"
          [(ngModel)]="filters.pageSize"
          (ngModelChange)="emitFilter()"
        >
          @for (opt of pageSizeOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
          }
        </select>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-between mt-4">
        <button
          class="btn btn-outline-secondary d-flex align-items-center gap-2"
          (click)="resetFilter()"
        >
          <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>
