<td>{{ product().label }}</td>
<td>{{ product().description }}</td>
<td>{{ product().category }}</td>
<td>{{ product().price | currency : "EUR" }}</td>
<td>{{ product().createdAt | formatDate }}</td>
<td>{{ product().updatedAt | formatDate }}</td>
<td>
  <span
    class="badge"
    [class.bg-success]="product().available"
    [class.bg-danger]="!product().available"
  >
    {{ product().available ? "Disponible" : "Indisponible" }}
  </span>
</td>
@if(authUserService.isAdmin()){
<td class="text-end">
  <button class="btn btn-outline-primary mx-1" (click)="onEdit()">
    <i class="bi bi-pencil me-1"></i> Modifier
  </button>
  <app-remove-product [productId]="product()._id" (onRemoved)="onRemove()" />
</td>
}@else{
<td class="text-center">
  <input
    type="number"
    class="form-control w-50 mx-auto mb-2"
    min="1"
    [(ngModel)]="productQuantity"
  />
  <button
    class="btn btn-primary btn-sm"
    (click)="addToCart(productQuantity())"
    [disabled]="!product().available"
  >
    <i class="bi bi-cart-plus me-1"></i> Ajouter au panier
  </button>
</td>
}
