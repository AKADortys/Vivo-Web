<nav aria-label="Pagination">
  <ul
    class="pagination justify-content-start align-items-center bg-gradient p-1 rounded-2"
  >
    <!-- Bouton Précédent -->
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button class="page-link" (click)="prevPage()" aria-label="Précédent">
        <i class="bi bi-chevron-left"></i>
      </button>
    </li>

    <!-- Numéros de page -->
    @for (page of pages(); track page) {
    <li class="page-item" [class.active]="page === currentPage()">
      <button class="page-link" (click)="goToPage(page)">
        {{ page }}
      </button>
    </li>
    }

    <!-- Bouton Suivant -->
    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button class="page-link" (click)="nextPage()" aria-label="Suivant">
        <i class="bi bi-chevron-right"></i>
      </button>
    </li>
    <span class="mx-auto badge rounded-pill bg-primary"
      >{{ totalItems() }} {{ totalItems() > 1 ? "éléments" : "élément" }}</span
    >
  </ul>
</nav>
