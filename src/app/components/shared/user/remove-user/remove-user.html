<button
  class="btn btn-outline-danger"
  [disabled]="isLoading() || !userId"
  (click)="onRemove()"
  title="Supprimer cet utilisateur définitivement"
>
  @if(isLoading()){
  <span> <i class="fa fa-spinner fa-spin"></i> Suppression... </span>
  }@else{
  <i class="bi bi-trash3-fill"></i>
  <span>Supprimer</span>
  }
</button>
