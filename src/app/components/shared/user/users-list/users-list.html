<div class="mb-2 row justify-content-start gap-3 align-items-start">
  <button
    class="col-10 mx-auto btn btn-outline-primary btn-lg"
    (click)="onAddUser()"
  >
    <i class="bi bi-plus-circle-fill"></i> Ajouter
  </button>
  <app-query-handle-user
    [filters]="paginatedFilter()"
    (filterChange)="onFilterChange($event)"
    (filterReset)="onFilterReset()"
  />
  <div class="btn-group mb-3">
    <button
      class="btn"
      [class.btn-primary]="displayMode() === 'card'"
      [class.btn-outline-primary]="displayMode() !== 'card'"
      (click)="setDisplayMode('card')"
    >
      Cartes
    </button>

    <button
      class="btn"
      [class.btn-primary]="displayMode() === 'table'"
      [class.btn-outline-primary]="displayMode() !== 'table'"
      (click)="setDisplayMode('table')"
    >
      Tableau
    </button>
  </div>
</div>
<!-- Composant de pagination -->
<app-pagination
  [totalItems]="totalItems()"
  [itemsPerPage]="paginatedFilter().pageSize!"
  [currentPage]="currentPage()"
  (pageChange)="onPageChange($event)"
  class="col-12"
/>
<div class="container rounded p-4 my-4 border shadow-sm">
  <!-- MODE TABLE -->
  @if (displayMode() === 'table') {
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead class="table-light">
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Rôle</th>
          <th>Actif</th>
          <th>Créé le</th>
          <th>Maj</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (user of users(); track user._id) {
        <tr
          app-user-table
          [user]="user"
          (editUser)="onEditUser($event)"
          (removeUser)="onRemoveUser()"
        ></tr>
        }
      </tbody>
    </table>
  </div>
  }

  <!-- MODE CARDS -->
  @if (displayMode() === 'card') {
  <div class="row justify-content-around">
    @for (user of users(); track user._id) {
    <div class="col-12 col-md-10 col-xxl-6 mb-4">
      <app-user-card
        [user]="user"
        (editUser)="onEditUser($event)"
        (removeUser)="onRemoveUser()"
      />
    </div>
    }
  </div>
  }

  <!-- Affichage du message de chargement -->
  @if (isLoading()) {
  <div class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>
  }

  <!-- Affichage des erreurs -->
  @if (errorMessage()) {
  <div class="alert alert-danger text-center mx-auto">
    {{ errorMessage() }}
  </div>
  }
</div>
<!-- Composant de pagination -->
<app-pagination
  [totalItems]="totalItems()"
  [itemsPerPage]="paginatedFilter().pageSize!"
  [currentPage]="currentPage()"
  (pageChange)="onPageChange($event)"
/>

<app-modal #addModal title="Ajout utilisateur">
  <app-register-form (submited)="onAddedUser()" />
</app-modal>

<!-- Modal Edit -->
<app-modal #editModal title="Eddition utilisateur">
  <app-user-edit
    [user]="selectedUser()"
    (save)="onEditedUser()"
  ></app-user-edit>
</app-modal>
