@if (displayMode) {
<button
  class="btn btn-outline-danger btn-sm"
  (click)="cancelOrder()"
  [disabled]="isLoading()"
  title="Annuler la commande"
>
  @if (isLoading()) {
  <span
    class="spinner-border spinner-border-sm"
    role="status"
    aria-hidden="true"
  ></span>
  } @else {
  <i class="bi bi-x-circle"></i>
  }
</button>
} @else {
<button
  class="btn btn-outline-danger w-100"
  (click)="cancelOrder()"
  [disabled]="isLoading()"
>
  @if (isLoading()) {
  <span
    class="spinner-border spinner-border-sm me-2"
    role="status"
    aria-hidden="true"
  ></span>
  Annulation...
  } @else {
  <i class="bi bi-x-circle me-2"></i>
  Annuler la commande
  }
</button>
}
