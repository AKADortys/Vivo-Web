@if (storeStatus$ | async; as config) {
@if (isStoreOpen(config)) {
<button class="btn btn-success btn-sm" (click)="createOrder()">
  <i class="bi bi-check-circle mx-1"></i>Confirmer la commande
</button>
} @else {
<div class="alert alert-warning mb-0 p-2 text-center small">
  <i class="bi bi-clock-history me-1"></i>
  {{ getClosureReason(config) }}
</div>
}
}
