<div class="d-flex align-items-center gap-2 px-3 py-2">
  <i
    class="bi bi-{{ isDark() ? 'moon-stars-fill' : 'sun-fill' }}"
    style="font-size: 1.2rem"
  ></i>
  <div class="form-check form-switch m-0">
    <input
      class="form-check-input"
      type="checkbox"
      id="themeToggle"
      [ngModel]="isDark()"
      (ngModelChange)="toggle()"
    />
  </div>
</div>
